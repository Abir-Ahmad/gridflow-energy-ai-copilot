[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "gridflow-energy-ai-copilot"
version = "0.1.0"
description = "Evidence-bound LLM tool calling and local RAG over NESO demand data"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "openai>=3.49,<4", "fastembed>=0.7,<1", "numpy>=1.26,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
energy_copilot = ["corpus/*.json", "static/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs downloaded embedding model (no paid API)"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
